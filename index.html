<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBA 2601 课程日程表</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <!-- 引入 ical.js 用于解析 ICS -->
    <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .fc-event { cursor: pointer; padding: 2px 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">MBA 2601 课程日程表</h1>
                    <p class="text-xs text-gray-500">多通道在线实时同步</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <input type="text" id="searchInput" placeholder="搜索课程或关键字..." class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-64">
                
                <!-- 管理员设置开关（低调小齿轮） -->
                <button onclick="toggleSettings()" title="后台设置" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>

        <!-- 默认折叠的管理员配置面板 -->
        <div id="settingsPanel" class="hidden bg-gray-50 border-t border-gray-200 px-4 py-3">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center gap-3">
                <span class="text-xs font-bold text-red-600 uppercase tracking-wider">订阅源配置</span>
                <input type="text" id="icsUrlInput" value="https://raw.giteeusercontent.com/blue0703/class-schedule-2601/raw/master/MBA2601.ics" class="flex-grow px-3 py-1.5 text-xs border border-gray-300 rounded bg-white">
                <button onclick="loadAndRender()" class="px-3 py-1.5 bg-blue-600 text-white text-xs font-medium rounded hover:bg-blue-700 transition">重新加载</button>
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col">
        <!-- 统计面板 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-medium">日程总数</p>
                    <p id="totalEvents" class="text-2xl font-bold text-gray-900">0</p>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">📊</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-medium">当前视图状态</p>
                    <p id="currentViewName" class="text-lg font-bold text-gray-900">月视图</p>
                </div>
                <div class="p-3 bg-green-50 text-green-600 rounded-lg">📅</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-medium">同步状态</p>
                    <p id="syncStatus" class="text-sm font-semibold text-emerald-600 mt-1">● 连接中...</p>
                </div>
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg">⚡</div>
            </div>
        </div>

        <!-- 日历主体 -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 flex-grow flex flex-col">
            <div id="calendar" class="w-full flex-grow" style="min-height: 650px;"></div>
        </div>
    </main>

    <!-- 事件详情弹窗 -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl transform transition-all">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-900">课程详情</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1">✕</button>
            </div>
            <div class="space-y-3 text-sm text-gray-600 mb-6">
                <p><strong>开始时间：</strong><span id="modalStart"></span></p>
                <p><strong>结束时间：</strong><span id="modalEnd"></span></p>
                <p><strong>地点：</strong><span id="modalLocation">无</span></p>
                <div>
                    <strong>详细描述：</strong>
                    <div id="modalDescription" class="mt-1 p-3 bg-gray-50 rounded-lg text-gray-700 max-h-40 overflow-y-auto whitespace-pre-wrap">无</div>
                </div>
            </div>
            <div class="text-right">
                <button onclick="closeModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let calendar;
        let allEvents = [];

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('hidden');
        }

        async function loadAndRender() {
            const icsUrl = document.getElementById('icsUrlInput').value.trim();
            // 采用多重公共代理备用通道，防止单点故障导致打不开
            const proxyUrls = [
                "https://api.allorigins.win/raw?url=" + encodeURIComponent(icsUrl),
                "https://corsproxy.io/?\\?" + encodeURIComponent(icsUrl)
            ];

            let icsText = null;
            for (let url of proxyUrls) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.includes('BEGIN:VCALENDAR')) {
                            icsText = text;
                            break;
                        }
                    }
                } catch (e) {
                    console.warn("通道尝试失败，切换备用通道...");
                }
            }

            if (icsText) {
                parseAndInitCalendar(icsText);
                document.getElementById('syncStatus').innerText = "● 在线同步正常";
                document.getElementById('syncStatus').className = "text-sm font-semibold text-emerald-600 mt-1";
            } else {
                document.getElementById('syncStatus').innerText = "● 无法连接数据源";
                document.getElementById('syncStatus').className = "text-sm font-semibold text-rose-600 mt-1";
            }
        }

        function parseAndInitCalendar(icsData) {
            try {
                const jcalData = ICAL.parse(icsData);
                const comp = new ICAL.Component(jcalData);
                const vevents = comp.getAllSubcomponents('vevent');

                allEvents = vevents.map(vevent => {
                    const event = new ICAL.Event(vevent);
                    return {
                        title: event.summary || '无标题课程',
                        start: event.startDate.toJSDate(),
                        end: event.endDate ? event.endDate.toJSDate() : event.startDate.toJSDate(),
                        description: event.description || '',
                        location: event.location || ''
                    };
                });

                document.getElementById('totalEvents').innerText = allEvents.length;
                
                if (calendar) {
                    calendar.removeAllEvents();
                    calendar.addEventSource(allEvents);
                } else {
                    initCalendar(allEvents);
                }
            } catch (e) {
                console.error("ICS 解析错误", e);
            }
        }

        function initCalendar(events) {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'zh-cn',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
                },
                buttonText: { today: '今天', month: '月', week: '周', day: '日', list: '列表' },
                events: events,
                eventClick: info => showModal(info.event),
                datesSet: info => {
                    const titles = { 'dayGridMonth': '月视图', 'timeGridWeek': '周视图', 'timeGridDay': '日视图', 'listMonth': '列表视图' };
                    document.getElementById('currentViewName').innerText = titles[info.view.type] || '日程视图';
                }
            });
            calendar.render();
        }

        function showModal(event) {
            document.getElementById('modalTitle').innerText = event.title;
            document.getElementById('modalStart').innerText = event.start ? event.start.toLocaleString() : '未指定';
            document.getElementById('modalEnd').innerText = event.end ? event.end.toLocaleString() : '未指定';
            document.getElementById('modalLocation').innerText = event.extendedProps.location || '无';
            document.getElementById('modalDescription').innerText = event.extendedProps.description || '无';
            document.getElementById('eventModal').classList.remove('hidden');
            document.getElementById('eventModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('flex');
            document.getElementById('eventModal').classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filtered = allEvents.filter(ev => 
                ev.title.toLowerCase().includes(keyword) || 
                ev.description.toLowerCase().includes(keyword) ||
                ev.location.toLowerCase().includes(keyword)
            );
            calendar.removeAllEvents();
            calendar.addEventSource(filtered);
        });

        document.addEventListener('DOMContentLoaded', loadAndRender);
    </script>
</body>
</html>
