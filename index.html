<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="华东师大 MBA 2026 级全日制课程日程表，支持月/周/日/列表视图、课程筛选与日历订阅。">
<title>MBA 2601 课程日程表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 8v11H5V10h14z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">

<!-- 依赖本地化：随 Cloudflare 静态资源一起分发，避免部署后受第三方 CDN 可用性影响 -->
<script defer src="/vendor/fullcalendar.min.js"></script>
<script defer src="/vendor/fullcalendar-zh-cn.js"></script>
<script defer src="/vendor/ical.min.js"></script>
<script defer src="/assets/app.js"></script>
</head>

<body>
<header class="topbar">
  <div class="shell">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <h1>MBA 2601 课程日程表</h1>
          <p id="calMeta">华东师大 MBA 2026 级 · 实时同步</p>
        </div>
      </div>

      <div class="tools">
        <input id="searchInput" class="field search-field" type="search" placeholder="搜索课程 / 教师 / 地点（按 / 聚焦）" aria-label="搜索课程">
        <select id="courseFilter" class="field" aria-label="按课程筛选">
          <option value="">全部课程</option>
        </select>
        <button id="refreshBtn" class="btn" title="立即刷新">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>刷新</span>
        </button>
        <button id="themeBtn" class="btn" title="切换明暗主题">◐</button>
        <button id="settingsBtn" class="btn" title="订阅源设置" aria-label="订阅源设置">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="settingsPanel" class="settings hidden">
    <div class="shell">
      <div class="settings-inner">
        <div class="field-block" style="flex:1 1 340px">
          <label for="icsSourceInput">ICS 订阅源地址</label>
          <input id="icsSourceInput" class="field" type="url" spellcheck="false"
                 value="https://raw.githubusercontent.com/majun8088/class-schedule-2601/refs/heads/master/MBA2601.ics">
        </div>
        <button id="applySourceBtn" class="btn btn-primary">应用并重新加载</button>
        <button id="resetSourceBtn" class="btn">恢复默认</button>
        <div class="field-block" style="flex:1 1 300px">
          <label for="apiBaseInput">实时代理地址（可选）</label>
          <input id="apiBaseInput" class="field" type="url" spellcheck="false" placeholder="留空=只用同源接口，例如 https://mba2601-ics.xxx.workers.dev">
        </div>
        <button id="applyApiBtn" class="btn btn-primary">保存并实时刷新</button>
        <button id="copyLinkBtn" class="btn">复制日历订阅地址</button>
        <a class="btn" href="/standalone.html" download="MBA2601-日程表.html" title="CSS/JS 依赖全部内联，可直接双击打开或直接托管">下载单文件版</a>
        <span class="field-block">
          <label>说明</label>
          <span class="up-meta">订阅地址可直接导入 iOS / Outlook / Google 日历，随源自动更新</span>
        </span>
      </div>
    </div>
  </div>
</header>

<noscript>
  <p style="padding:16px;margin:0;background:#fff7ed;color:#9a3412;text-align:center">
    该日程表依赖 JavaScript 渲染，请在浏览器中启用 JavaScript 后刷新页面。
  </p>
</noscript>

<main class="shell">
  <section class="stats">
    <div class="card stat">
      <div style="min-width:0">
        <div class="stat-label">当前筛选日程</div>
        <div id="statTotal" class="stat-value">0</div>
        <div id="statTotalSub" class="stat-sub">等待数据…</div>
      </div>
      <div class="stat-icon" style="background:var(--brand-soft);color:var(--brand)">📚</div>
    </div>

    <div class="card stat">
      <div style="min-width:0">
        <div class="stat-label">总课时（小时）</div>
        <div id="statHours" class="stat-value">0</div>
        <div id="statHoursSub" class="stat-sub">按当前筛选结果统计</div>
      </div>
      <div class="stat-icon" style="background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)">⏱️</div>
    </div>

    <div class="card stat">
      <div style="min-width:0">
        <div class="stat-label">下一节课 <span id="nextCountdown" style="color:var(--brand);font-weight:700"></span></div>
        <div id="statNext" class="stat-value" style="font-size:16px">—</div>
        <div id="statNextSub" class="stat-sub">等待数据…</div>
      </div>
      <div class="stat-icon" style="background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)">🔔</div>
    </div>

    <div class="card stat">
      <div style="min-width:0">
        <div class="stat-label">同步状态</div>
        <div id="syncStatus" class="dot-status" style="margin-top:6px">
          <span class="dot loading"></span><span>正在连接…</span>
        </div>
        <div id="filterHint" class="stat-sub">数据源：Gitee Raw</div>
      </div>
      <div class="stat-icon" style="background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)">⚡</div>
    </div>
  </section>

  <section class="layout">
    <div class="card panel">
      <div class="panel-head">
        <span class="panel-title">🗓️ <span id="viewName">月视图</span></span>
        <label class="up-meta" style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input id="futureToggle" type="checkbox" style="accent-color:var(--brand)">只看未开始的课程
        </label>
      </div>
      <div id="calendar" class="calendar-wrap skeleton sk-block" aria-live="polite"></div>
    </div>

    <aside class="card panel panel-side">
      <div class="panel-head"><span class="panel-title">📌 近期安排</span></div>
      <ul id="upcomingList" class="upcoming">
        <li><span class="up-bar"></span><span class="up-date"></span><span class="up-title">加载中…</span></li>
      </ul>
    </aside>
  </section>
</main>

<footer class="shell" style="padding-bottom:28px">
  <p class="up-meta" style="text-align:center">
    数据每 30 分钟自动同步 · 断网时自动回落本地缓存 · 快捷键：<code>/</code> 搜索，<code>Esc</code> 关闭弹窗
  </p>
</footer>

<div id="eventModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">课程详情</h3>
      <button id="closeModalBtn" class="icon" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <span class="pill"><span id="modalBadge" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--brand)"></span><span id="modalCourse">未分类</span></span>
      <div class="kv"><span>开始</span><span id="modalStart">—</span></div>
      <div class="kv"><span>结束</span><span id="modalEnd">—</span></div>
      <div class="kv"><span>地点</span><span id="modalLocation">未标注</span></div>
      <div>
        <span class="up-meta">课程详情</span>
        <div id="modalDesc" class="desc-box">无</div>
      </div>
    </div>
    <div class="modal-foot">
      <button id="okModalBtn" class="btn btn-primary">知道了</button>
    </div>
  </div>
</div>

<div id="toastBox" class="toast-box"></div>
</body>
</html>
