<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCal 日历订阅展示中心</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FullCalendar CSS & JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- ICAL.js for parsing iCalendar files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Styling overrides for FullCalendar in dark mode */
        .dark .fc {
            --fc-border-color: #374151;
            --fc-page-bg-color: #1f2937;
            --fc-neutral-bg-color: #111827;
            --fc-list-event-hover-bg-color: #374151;
            --fc-today-bg-color: rgba(59, 130, 246, 0.1);
        }
        .fc {
            font-family: inherit;
        }
        .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: 700;
        }
        .fc-button-primary {
            background-color: #2563eb !important;
            border-color: #2563eb !important;
            border-radius: 0.5rem !important;
            padding: 0.4rem 0.8rem !important;
            text-transform: capitalize !important;
            font-weight: 500 !important;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }
        .fc-button-primary:hover {
            background-color: #1d4ed8 !important;
            border-color: #1d4ed8 !important;
        }
        .fc-button-active {
            background-color: #1e40af !important;
            border-color: #1e40af !important;
        }
        .fc-event {
            cursor: pointer;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.85rem;
            transition: transform 0.1s ease;
        }
        .fc-event:hover {
            transform: scale(1.01);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 flex flex-col">

    <!-- 顶部导航栏 -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <!-- 品牌标识与标题 -->
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600 text-white rounded-xl shadow-md">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">iCal 日历订阅展示中心</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">自动加载并展示 .ics 订阅日程</p>
                </div>
            </div>

            <!-- 搜索过滤栏 -->
            <div class="flex items-center gap-3 flex-1 max-w-md mx-2">
                <div class="relative w-full">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索日程标题、地点或内容..." 
                           class="w-full pl-9 pr-8 py-1.5 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700/50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- 右侧工具栏 -->
            <div class="flex items-center gap-2">
                <!-- 手动刷新按钮 -->
                <button id="reloadBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="重新加载日历">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-blue-500"></i>
                    <span class="hidden sm:inline">刷新</span>
                </button>

                <!-- 主题切换按钮 -->
                <button id="themeToggle" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition" title="切换深色模式">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体布局 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 overflow-hidden">
        
        <!-- 侧边栏：订阅源管理与配置 -->
        <aside class="lg:col-span-1 space-y-6 flex flex-col">
            
            <!-- 订阅链接配置卡片 -->
            <div class="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                <h2 class="text-sm font-semibold flex items-center gap-2 text-slate-700 dark:text-slate-200">
                    <i data-lucide="link" class="w-4 h-4 text-blue-500"></i>
                    当前订阅源地址
                </h2>
                
                <div class="space-y-3">
                    <div>
                        <input type="url" id="icsUrlInput" placeholder="输入或修改 .ics 订阅链接"
                               class="w-full text-xs px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition font-mono">
                    </div>

                    <!-- CORS 代理开关 -->
                    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/50 p-2 rounded-lg border border-slate-200 dark:border-slate-700">
                        <span class="flex items-center gap-1" title="使用跨域代理绕过浏览器限制">
                            <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i> CORS 代理
                        </span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="corsToggle" class="sr-only peer" checked>
                            <div class="w-8 h-4 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all dark:peer-focus:ring-blue-800 peer-checked:bg-blue-600"></div>
                        </label>
                    </div>

                    <button id="applyUrlBtn" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        <span>加载该订阅源</span>
                    </button>
                </div>
            </div>

            <!-- 日历元数据统计组件 -->
            <div id="statsCard" class="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm space-y-3 flex-1">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">订阅源详情</h3>
                
                <div class="space-y-2 text-xs">
                    <div>
                        <span class="text-slate-400">日历名称:</span>
                        <p id="calTitle" class="font-semibold text-slate-700 dark:text-slate-200 truncate">正在加载...</p>
                    </div>
                    <div>
                        <span class="text-slate-400">已载入日程数:</span>
                        <p id="calEventCount" class="font-semibold text-blue-600 dark:text-blue-400">0</p>
                    </div>
                    <div>
                        <span class="text-slate-400">当前数据源:</span>
                        <p id="calSource" class="font-mono text-[10px] text-slate-500 truncate">-</p>
                    </div>
                </div>

                <div class="pt-2">
                    <button id="exportEventsBtn" class="w-full py-1.5 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 rounded text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center justify-center gap-1.5 transition">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i> 导出为 JSON 数据
                    </button>
                </div>
            </div>

            <!-- 错误提示横幅 -->
            <div id="errorAlert" class="hidden bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-xl p-3 text-xs text-red-700 dark:text-red-300 flex items-start gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                <div class="flex-1">
                    <p class="font-semibold">加载日历失败</p>
                    <p id="errorMessage" class="mt-0.5 opacity-90">请检查订阅链接是否正确，或尝试关闭/开启 CORS 代理开关。</p>
                </div>
                <button onclick="this.parentElement.classList.add('hidden')" class="text-red-400 hover:text-red-600">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>

        </aside>

        <!-- 主日历展示区域 -->
        <section class="lg:col-span-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-4 md:p-6 flex flex-col relative min-h-[600px]">
            
            <!-- 加载遮罩层 -->
            <div id="loadingSpinner" class="hidden absolute inset-0 bg-white/70 dark:bg-slate-800/70 z-10 backdrop-blur-sm flex items-center justify-center rounded-xl">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs font-medium text-slate-600 dark:text-slate-300">正在解析日历订阅...</span>
                </div>
            </div>

            <!-- FullCalendar 渲染容器 -->
            <div id="calendar" class="flex-1"></div>
        </section>

    </main>

    <!-- 日程详情弹窗 -->
    <div id="eventModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl max-w-lg w-full overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            
            <!-- 弹窗头部 -->
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex items-start justify-between bg-slate-50/50 dark:bg-slate-800">
                <div>
                    <span id="modalCategory" class="inline-block px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 rounded mb-1">日程详情</span>
                    <h3 id="modalTitle" class="text-lg font-bold text-slate-800 dark:text-white leading-snug">日程标题</h3>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 弹窗内容主体 -->
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <!-- 时间信息 -->
                <div class="flex items-start gap-3 text-sm text-slate-600 dark:text-slate-300">
                    <i data-lucide="clock" class="w-4 h-4 text-slate-400 mt-1 shrink-0"></i>
                    <div>
                        <p class="font-medium text-slate-800 dark:text-slate-200" id="modalTime">-</p>
                        <p class="text-xs text-slate-400" id="modalDuration"></p>
                    </div>
                </div>

                <!-- 地点信息 -->
                <div id="modalLocationContainer" class="flex items-start gap-3 text-sm text-slate-600 dark:text-slate-300">
                    <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 mt-1 shrink-0"></i>
                    <div>
                        <p class="font-medium text-slate-800 dark:text-slate-200" id="modalLocation">-</p>
                    </div>
                </div>

                <!-- 描述信息 -->
                <div id="modalDescriptionContainer" class="space-y-1.5 pt-2 border-t border-slate-100 dark:border-slate-700">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">详细说明</span>
                    <div id="modalDescription" class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                        暂无说明。
                    </div>
                </div>
            </div>

            <!-- 弹窗底部 -->
            <div class="px-6 py-3 bg-slate-50 dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-2">
                <button id="closeModalBtn2" class="px-4 py-1.5 text-sm font-medium bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition">关闭</button>
            </div>
        </div>
    </div>

    <!-- 应用逻辑脚本 -->
    <script>
        // ==========================================
        // 配置默认的 .ics 订阅链接（可在此处替换为你自己的链接）
        // ==========================================
        const DEFAULT_ICS_URL = "https://raw.giteeusercontent.com/blue0703/class-schedule-2601/raw/master/MBA2601.ics";

        // 全局状态
        let calendar = null;
        let parsedEvents = [];
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        // DOM 元素引用
        const icsUrlInput = document.getElementById('icsUrlInput');
        const applyUrlBtn = document.getElementById('applyUrlBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const corsToggle = document.getElementById('corsToggle');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const themeToggle = document.getElementById('themeToggle');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const statsCard = document.getElementById('statsCard');

        // 弹窗元素引用
        const eventModal = document.getElementById('eventModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalTime = document.getElementById('modalTime');
        const modalDuration = document.getElementById('modalDuration');
        const modalLocation = document.getElementById('modalLocation');
        const modalLocationContainer = document.getElementById('modalLocationContainer');
        const modalDescription = document.getElementById('modalDescription');
        const modalDescriptionContainer = document.getElementById('modalDescriptionContainer');

        // 初始化图标
        lucide.createIcons();

        // 初始化主题
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // 初始化 FullCalendar 日历插件
        document.addEventListener('DOMContentLoaded', () => {
            const calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'zh-cn',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay,listMonth'
                },
                buttonText: {
                    today: '今天',
                    month: '月',
                    week: '周',
                    day: '日',
                    list: '列表'
                },
                height: '100%',
                navLinks: true,
                editable: false,
                dayMaxEvents: true,
                eventTimeFormat: {
                    hour: 'numeric',
                    minute: '2-digit',
                    meridiem: 'short'
                },
                eventClick: function(info) {
                    showEventDetails(info.event);
                }
            });

            calendar.render();

            // 设置输入框默认值并自动加载订阅源
            icsUrlInput.value = DEFAULT_ICS_URL;
            fetchAndRenderCalendar(DEFAULT_ICS_URL);
        });

        // 监听切换主题事件
        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // 点击按钮或刷新加载订阅
        applyUrlBtn.addEventListener('click', () => {
            const url = icsUrlInput.value.trim();
            if (url) fetchAndRenderCalendar(url);
        });

        reloadBtn.addEventListener('click', () => {
            const url = icsUrlInput.value.trim() || DEFAULT_ICS_URL;
            fetchAndRenderCalendar(url);
        });

        // 核心：获取并渲染远程/本地 ICS 订阅数据
        async function fetchAndRenderCalendar(url) {
            hideError();
            showLoading(true);

            try {
                let fetchUrl = url;
                if (corsToggle.checked) {
                    fetchUrl = CORS_PROXY + encodeURIComponent(url);
                }

                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error(`HTTP 状态码错误: ${response.status}`);
                
                const icsData = await response.text();
                processICSData(icsData, url);
            } catch (err) {
                console.error(err);
                showError(`无法加载日历: ${err.message}。请检查链接是否正确或尝试切换 CORS 代理开关。`);
            } finally {
                showLoading(false);
            }
        }

        // 解析 ICS 文本内容并更新日历
        function processICSData(icsString, sourceName) {
            try {
                const jcalData = ICAL.parse(icsString);
                const comp = new ICAL.Component(jcalData);
                const vevents = comp.getAllSubcomponents('vevent');

                // 提取日历名称
                const calNameProp = comp.getFirstPropertyValue('x-wr-calname');
                const calName = calNameProp || "自定义订阅日历";

                parsedEvents = vevents.map(vevent => {
                    const event = new ICAL.Event(vevent);
                    
                    return {
                        id: event.uid || Math.random().toString(36).substring(2, 9),
                        title: event.summary || '未命名日程',
                        start: event.startDate ? event.startDate.toJSDate() : null,
                        end: event.endDate ? event.endDate.toJSDate() : null,
                        location: event.location || '',
                        description: event.description || '',
                        allDay: event.startDate ? event.startDate.isDate : false,
                        backgroundColor: '#2563eb',
                        borderColor: '#1d4ed8'
                    };
                }).filter(e => e.start !== null);

                // 更新日历事件源
                calendar.removeAllEvents();
                calendar.addEventSource(parsedEvents);

                // 更新侧边栏统计信息
                document.getElementById('calTitle').textContent = calName;
                document.getElementById('calEventCount').textContent = parsedEvents.length;
                document.getElementById('calSource').textContent = sourceName;

            } catch (err) {
                console.error(err);
                showError("解析 iCalendar (.ics) 文件结构失败，格式可能不正确。");
            }
        }

        // 实时搜索过滤功能
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            const filteredEvents = parsedEvents.filter(ev => {
                return (ev.title && ev.title.toLowerCase().includes(query)) ||
                       (ev.description && ev.description.toLowerCase().includes(query)) ||
                       (ev.location && ev.location.toLowerCase().includes(query));
            });

            calendar.removeAllEvents();
            calendar.addEventSource(filteredEvents);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            calendar.removeAllEvents();
            calendar.addEventSource(parsedEvents);
        });

        // 弹出日程详情模态框
        function showEventDetails(eventObj) {
            modalTitle.textContent = eventObj.title || '未命名日程';
            
            const start = eventObj.start;
            const end = eventObj.end;
            
            if (start) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                modalTime.textContent = start.toLocaleDateString('zh-CN', options);
                
                if (end) {
                    const durationMs = end - start;
                    const hours = Math.floor(durationMs / (1000 * 60 * 60));
                    const mins = Math.round((durationMs % (1000 * 60 * 60)) / (1000 * 60));
                    modalDuration.textContent = `结束时间: ${end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} (持续 ${hours > 0 ? hours + '小时 ' : ''}${mins}分钟)`;
                } else {
                    modalDuration.textContent = '';
                }
            }

            // 地点
            const loc = eventObj.extendedProps.location;
            if (loc && loc.trim() !== '') {
                modalLocation.textContent = loc;
                modalLocationContainer.classList.remove('hidden');
            } else {
                modalLocationContainer.classList.add('hidden');
            }

            // 描述
            const desc = eventObj.extendedProps.description;
            if (desc && desc.trim() !== '') {
                modalDescription.textContent = desc;
                modalDescriptionContainer.classList.remove('hidden');
            } else {
                modalDescriptionContainer.classList.add('hidden');
            }

            eventModal.classList.remove('hidden');
        }

        // 关闭弹窗事件
        [document.getElementById('closeModalBtn'), document.getElementById('closeModalBtn2')].forEach(btn => {
            btn.addEventListener('click', () => eventModal.classList.add('hidden'));
        });
        eventModal.addEventListener('click', (e) => {
            if (e.target === eventModal) eventModal.classList.add('hidden');
        });

        // 导出解析后的 JSON 数据
        document.getElementById('exportEventsBtn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(parsedEvents, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "calendar_events.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        // 辅助工具函数
        function showLoading(state) {
            if (state) loadingSpinner.classList.remove('hidden');
            else loadingSpinner.classList.add('hidden');
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.classList.remove('hidden');
        }

        function hideError() {
            errorAlert.classList.add('hidden');
        }
    </script>
</body>
</html>
